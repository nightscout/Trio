files:
  # String Catalogs hold every language in a single file, so source and
  # translation point at the same path and carry no locale placeholder.
  # Crowdin requires the multilingual flag for that.
  - source: /Trio/Sources/Localizations/Main/Localizable.xcstrings
    translation: /Trio/Sources/Localizations/Main/Localizable.xcstrings
    multilingual: true
  - source: /Trio/Resources/InfoPlist.xcstrings
    translation: /Trio/Resources/InfoPlist.xcstrings
    multilingual: true
