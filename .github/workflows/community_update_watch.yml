name: Community Update Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "20 7 * * 1" # Monday at 07:20 UTC

permissions:
  contents: read
  issues: write

env:
  UPSTREAM_REPO: nightscout/Trio
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: main

jobs:
  watch:
    name: Watch Trio community updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check upstream and local overlap
        id: upstream
        shell: bash
        run: bash .github/scripts/community_update_overlap.sh

      - name: Create or update tracking issue
        if: steps.upstream.outputs.has_update == 'true'
        uses: actions/github-script@v8
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.upstream_sha }}
          LOCAL_SHA: ${{ steps.upstream.outputs.local_sha }}
          UPSTREAM_COMMITS: ${{ steps.upstream.outputs.commits }}
          LOCAL_CUSTOM_FILES: ${{ steps.upstream.outputs.local_custom_files }}
          OVERLAP_FILES: ${{ steps.upstream.outputs.overlap_files }}
          EQUIVALENT_COMMITS: ${{ steps.upstream.outputs.equivalent_commits }}
          MEDTRUM_STATUS: ${{ steps.upstream.outputs.medtrum_status }}
          LIBRE_STATUS: ${{ steps.upstream.outputs.libre_status }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const upstreamSha = process.env.UPSTREAM_SHA;
            const localSha = process.env.LOCAL_SHA;
            const commits = (process.env.UPSTREAM_COMMITS || '').trim();
            const localCustomFiles = (process.env.LOCAL_CUSTOM_FILES || '').trim();
            const overlapFiles = (process.env.OVERLAP_FILES || '').trim();
            const equivalentCommits = (process.env.EQUIVALENT_COMMITS || '').trim();
            const medtrumStatus = (process.env.MEDTRUM_STATUS || '').trim();
            const libreStatus = (process.env.LIBRE_STATUS || '').trim();
            const title = `Community update available: ${upstreamSha.slice(0, 7)}`;

            const body = [
              'Er staat een nieuwe Trio community update klaar.',
              '',
              `- Fork staat op: \`${localSha}\``,
              `- Community staat op: \`${upstreamSha}\``,
              '',
              'De checker heeft de nieuwe upstream-wijzigingen vergeleken met de volledige eigen delta van de fork.',
              '',
              '## Beslisregel voor de update-agent',
              'Controleer overlap ook inhoudelijk en niet alleen op bestandsnaam. Als upstream dezelfde mogelijkheid inmiddels aanbiedt, gebruik dan de officiële upstream-implementatie en verwijder de dubbele lokale code, patch of workflow-hook. Behoud alleen de aantoonbaar ontbrekende lokale delta. Verwijder bij Libre of Medtrum nooit stilzwijgend veiligheidschecks; verifieer eerst dat upstream hetzelfde gedrag dekt.',
              '',
              '## Componentcontrole',
              `- Medtrum: ${medtrumStatus || 'geen resultaat'}`,
              `- Libre: ${libreStatus || 'geen resultaat'}`,
              '',
              overlapFiles
                ? `## Bestands-overlap\n\nDeze bestanden zijn zowel lokaal als upstream gewijzigd:\n\n\`\`\`\n${overlapFiles}\n\`\`\``
                : '## Bestands-overlap\n\nGeen directe overlap op bestandsniveau gevonden; controleer functionele overlap nog steeds bij Libre, Medtrum en UI-workflows.',
              '',
              equivalentCommits
                ? `## Exact equivalente lokale commits\n\nDeze wijzigingen bestaan al upstream en moeten tijdens het bijwerken uit de lokale delta verdwijnen:\n\n\`\`\`\n${equivalentCommits}\n\`\`\``
                : '## Exact equivalente lokale commits\n\nGeen patch-equivalente commits gevonden.',
              '',
              localCustomFiles
                ? `## Huidige eigen aanpassingsgebieden\n\n\`\`\`\n${localCustomFiles}\n\`\`\``
                : '## Huidige eigen aanpassingsgebieden\n\nGeen lokale bestandsdelta gevonden.',
              '',
              commits
                ? `Laatste upstream commits:\n\n\`\`\`\n${commits}\n\`\`\``
                : 'Geen commitlijst beschikbaar.',
              '',
              'Laat de update-agent per eigen functie rapporteren: **behouden**, **vervangen door upstream** of **gedeeltelijk behouden**, inclusief de uitgevoerde build/testcontrole.'
            ].join('\n');

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open in:title "Community update available"`
            });

            if (search.data.total_count > 0) {
              const issue = search.data.items[0];
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Nieuwe check gevonden voor upstream \`${upstreamSha}\`.\n\n${body}`
              });
              return;
            }

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body
            });
